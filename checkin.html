<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>会议签到</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#EEF2FF 0%,#F0F9FF 50%,#FDF2F8 100%);color:#1F2937;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.banner-area{width:100%;max-width:420px;margin:0 auto;display:none}
.banner-area.visible{display:block}
.banner-area .banner-wrapper{width:100%;padding-top:40%;position:relative;background:#F3F4F6;overflow:hidden;border-radius:8px}
.banner-area .banner-wrapper img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.header-area{width:100%;text-align:center;padding:20px 20px 10px}
.header-area .event-icon{width:56px;height:56px;background:linear-gradient(135deg,#6366F1,#8B5CF6);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:10px}
.header-area .event-name{font-size:11px;color:#9CA3AF;margin-bottom:4px;display:none}
.header-area .event-name.visible{display:block}
.header-area h1{font-size:22px;font-weight:700;color:#1F2937}
.header-area .subtitle{font-size:13px;color:#6B7280;margin-top:4px}
.container{flex:1;width:100%;max-width:420px;padding:0 20px}
.card{background:#fff;border-radius:16px;padding:28px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid #F3F4F6;text-align:center}
.phone-input-section{}
.phone-input-section .icon-area{margin-bottom:16px}
.phone-input-section .icon-area .phone-icon{width:64px;height:64px;background:#EEF2FF;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:30px}
.phone-input-section p{font-size:14px;color:#6B7280;margin-bottom:20px}
.input-group{display:flex;gap:0;border:2px solid #E5E7EB;border-radius:12px;overflow:hidden;transition:all .2s}
.input-group:focus-within{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.input-group .prefix{display:flex;align-items:center;padding:0 14px;background:#F9FAFB;font-size:15px;color:#6B7280;border-right:1px solid #E5E7EB;white-space:nowrap;font-weight:500}
.input-group input{flex:1;padding:14px 16px;border:none;font-size:18px;font-family:inherit;color:#1F2937;background:#fff;outline:none;letter-spacing:2px;text-align:center}
.input-group input::placeholder{color:#D1D5DB;font-size:15px;letter-spacing:0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;outline:none;margin-top:16px}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{background:#D1D5DB;cursor:not-allowed;transform:none;box-shadow:none}
.result-area{display:none;animation:fadeIn .3s ease}
.result-area.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.result-success{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border:2px solid #6EE7B7;border-radius:16px;padding:30px 24px;text-align:center}
.result-success .check-icon{width:72px;height:72px;background:linear-gradient(135deg,#10B981,#34D399);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:36px;color:#fff;margin-bottom:12px}
.result-success h2{font-size:22px;color:#065F46;margin-bottom:4px}
.result-success .detail{font-size:14px;color:#047857;opacity:.8}
.result-error{background:#FEE2E2;border:2px solid #FCA5A5;border-radius:16px;padding:24px 20px;text-align:center}
.result-error .err-icon{font-size:40px;margin-bottom:8px}
.result-error h2{font-size:17px;color:#991B1B;margin-bottom:4px}
.result-error .detail{font-size:13px;color:#B91C1C;opacity:.8}
.result-duplicate{background:#FEF3C7;border:2px solid #FCD34D;border-radius:16px;padding:24px 20px;text-align:center}
.result-duplicate .dup-icon{font-size:40px;margin-bottom:8px}
.result-duplicate h2{font-size:17px;color:#92400E;margin-bottom:4px}
.result-duplicate .detail{font-size:13px;color:#A16207;opacity:.8}
.retry-btn{background:transparent;border:1.5px solid #E5E7EB;color:#6366F1;margin-top:12px}
.retry-btn:hover{background:#F5F3FF;border-color:#6366F1}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#065F46}
.toast.error{background:#991B1B}
.footer{text-align:center;padding:24px;font-size:12px;color:#9CA3AF;width:100%}
.hint{font-size:11px;color:#9CA3AF;margin-top:8px;line-height:1.5}
</style>
</head>
<body>

<div class="banner-area" id="banner-area">
  <div class="banner-wrapper">
    <img id="banner-img" src="" alt="">
  </div>
</div>

<div class="header-area">
  <div class="event-icon">&#128221;</div>
  <div class="event-name" id="event-name-display"></div>
  <h1>会议签到</h1>
  <p class="subtitle">请输入报名时填写的手机号</p>
</div>

<div class="container">
  <div class="card phone-input-section" id="input-section">
    <div class="icon-area">
      <div class="phone-icon">&#128241;</div>
    </div>
    <p>输入手机号完成签到</p>
    <div class="input-group">
      <span class="prefix">+86</span>
      <input type="tel" id="phone-input" placeholder="请输入手机号" maxlength="11" autocomplete="tel" inputmode="numeric">
    </div>
    <button class="btn btn-primary" id="checkin-btn" onclick="doCheckin()">签 到</button>
    <p class="hint">请使用报名时填写的手机号签到</p>
  </div>

  <div class="result-area" id="result-area"></div>

  <button class="btn retry-btn" id="retry-btn" style="display:none" onclick="resetForm()">返回重新签到</button>
</div>

<div class="toast" id="toast"></div>
<div class="footer">
  <p>&copy; 2026 唯太会 · 会议签到系统</p>
</div>

<script>
(function(){
  // ── Cloud Sync Layer (GitHub API) ──
  var _cloud = {
    token: ['github_pat_','11CK5IX6I0J4TL','gv1DOCAG_HjMnGz','v09yjkX6z8JJqgo','Ju3RQhE5HeNk62','JXzc3IZPTYT3NE','D4RoEDqfm5'].join(''),
    path: 'registrations.json',
    getSha: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ return r.json(); }).then(function(d){ return d.sha; });
    },
    fetch: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); })
        .then(function(d){
          var bin = atob(d.content);
          var bytes = new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
          return JSON.parse(new TextDecoder('utf-8').decode(bytes));
        });
    },
    push: function(data){
      var self = this;
      return self.getSha().then(function(sha){
        var body = {
          message: 'Check-in: ' + new Date().toISOString(),
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
          sha: sha
        };
        return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+self.path,{
          method:'PUT',
          headers:{'Authorization':'Bearer '+self.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
          body:JSON.stringify(body)
        }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); });
      });
    }
  };

  document.addEventListener('DOMContentLoaded', init);

  function init(){
    loadEventName();
    loadBanner();
    // Sync from cloud on load
    syncFromCloud();
    // Auto refresh every 20s
    setInterval(syncFromCloud, 20000);
    // Enter key to check in
    document.getElementById('phone-input').addEventListener('keydown', function(e){
      if(e.key === 'Enter') doCheckin();
    });
  }

  function loadEventName(){
    var el = document.getElementById('event-name-display');
    try{
      var config = JSON.parse(localStorage.getItem('meeting_config') || '{}');
      if(config.eventName){
        el.textContent = config.eventName;
        el.classList.add('visible');
      }
    }catch(e){}
  }

  function loadBanner(){
    var area = document.getElementById('banner-area');
    var img = document.getElementById('banner-img');
    try{
      var config = JSON.parse(localStorage.getItem('meeting_config') || '{}');
      if(config.bannerImage){
        img.src = config.bannerImage;
        area.classList.add('visible');
      } else {
        area.classList.remove('visible');
      }
    }catch(e){}
  }

  function syncFromCloud(){
    _cloud.fetch().then(function(cloud){
      if(cloud && cloud.registrations){
        localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
        if(cloud.config){
          var localCfg = {};
          try{ localCfg = JSON.parse(localStorage.getItem('meeting_config') || '{}'); }catch(e){}
          for(var k in cloud.config) localCfg[k] = cloud.config[k];
          localStorage.setItem('meeting_config', JSON.stringify(localCfg));
          loadEventName();
          loadBanner();
        }
      }
    }).catch(function(e){ console.log('Cloud sync skipped:', e.message); });
  }

  function getRegistrations(){
    try{ return JSON.parse(localStorage.getItem('meeting_registrations') || '[]'); }catch(e){ return []; }
  }

  function saveRegistrations(list){
    localStorage.setItem('meeting_registrations', JSON.stringify(list));
    var config = {};
    try{ config = JSON.parse(localStorage.getItem('meeting_config') || '{}'); }catch(e){}
    _cloud.push({ registrations: list, config: config, updatedAt: new Date().toISOString() })
      .catch(function(e){ console.log('Cloud push skipped:', e.message); });
  }

  window.doCheckin = function(){
    var phone = document.getElementById('phone-input').value.trim();
    if(!phone){
      showToast('请输入手机号','error');
      return;
    }
    if(!/^1[3-9]\d{9}$/.test(phone)){
      showToast('请输入正确的11位手机号','error');
      return;
    }

    var btn = document.getElementById('checkin-btn');
    btn.disabled = true;
    btn.textContent = '查找中...';

    // Small delay for UX
    setTimeout(function(){
      processCheckin(phone);
      btn.disabled = false;
      btn.textContent = '签 到';
    }, 300);
  };

  function processCheckin(phone){
    var list = getRegistrations();

    // Find by phone number
    var found = null;
    for(var i=0; i<list.length; i++){
      if(list[i].phone === phone){
        found = list[i];
        break;
      }
    }

    var resultArea = document.getElementById('result-area');
    var retryBtn = document.getElementById('retry-btn');
    var inputSection = document.getElementById('input-section');

    if(!found){
      resultArea.innerHTML =
        '<div class="result-error">'+
        '<div class="err-icon">&#10060;</div>'+
        '<h2>未找到报名记录</h2>'+
        '<div class="detail">该手机号未报名，请确认后重试</div>'+
        '</div>';
      resultArea.classList.add('active');
      inputSection.style.display = 'none';
      retryBtn.style.display = 'block';
      return;
    }

    if(found.checkinStatus === 'checked_in'){
      var t = found.checkinTime ? fmtTime(found.checkinTime) : '';
      resultArea.innerHTML =
        '<div class="result-duplicate">'+
        '<div class="dup-icon">&#9888;&#65039;</div>'+
        '<h2>已签到过</h2>'+
        '<div class="detail">'+esc(found.name)+' 已于 '+t+' 签到</div>'+
        '</div>';
      resultArea.classList.add('active');
      inputSection.style.display = 'none';
      retryBtn.style.display = 'block';
      return;
    }

    // Mark as checked in
    found.checkinStatus = 'checked_in';
    found.checkinTime = new Date().toISOString();
    saveRegistrations(list);

    resultArea.innerHTML =
      '<div class="result-success">'+
      '<div class="check-icon">&#10003;</div>'+
      '<h2>签到成功!</h2>'+
      '<div class="detail">'+esc(found.name)+'，欢迎光临</div>'+
      '</div>';
    resultArea.classList.add('active');
    inputSection.style.display = 'none';
    retryBtn.style.display = 'block';

    showToast('签到成功!','success');
  }

  window.resetForm = function(){
    document.getElementById('phone-input').value = '';
    document.getElementById('result-area').classList.remove('active');
    document.getElementById('result-area').innerHTML = '';
    document.getElementById('retry-btn').style.display = 'none';
    document.getElementById('input-section').style.display = '';
    // Refresh data
    syncFromCloud();
  };

  function fmtTime(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    var m = d.getMonth()+1;
    var dd = d.getDate();
    var h = d.getHours();
    var mi = d.getMinutes();
    var s = d.getSeconds();
    return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(dd<10?'0'+dd:dd)+' '+(h<10?'0'+h:h)+':'+(mi<10?'0'+mi:mi)+':'+(s<10?'0'+s:s);
  }

  function esc(s){
    if(!s) return '';
    var el = document.createElement('div');
    el.textContent = s;
    return el.innerHTML;
  }

  function showToast(msg, type){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type||'') + ' show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }
})();
</script>

</body>
</html>
