<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#F9FAFB;color:#1F2937;line-height:1.6;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #F3F4F6;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:600;color:#6366F1}
.header .nav-links{display:flex;gap:8px}
.header .nav-links a{font-size:12px;color:#6B7280;text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid #E5E7EB;transition:all .2s}
.header .nav-links a:hover{color:#6366F1;border-color:#6366F1;background:#F5F3FF}
.header .voice-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:#10B981;margin-left:12px;display:none}
.header .voice-indicator.active{display:flex}
.header .voice-indicator .dot{width:8px;height:8px;background:#10B981;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.container{max-width:960px;width:100%;margin:0 auto;padding:20px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid #F3F4F6}
.stat-card .stat-num{font-size:28px;font-weight:600;color:#1F2937}
.stat-card .stat-label{font-size:12px;color:#9CA3AF;margin-top:2px}
.stat-card.accent .stat-num{color:#6366F1}
.stat-card.success .stat-num{color:#10B981}
.card{background:#fff;border-radius:14px;padding:20px 24px;margin-bottom:16px;border:1px solid #F3F4F6}
.card h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#374151}
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.config-grid .field{}
.config-grid label{display:block;font-size:12px;font-weight:500;color:#6B7280;margin-bottom:4px}
.config-grid input{width:100%;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#F9FAFB;transition:all .2s}
.config-grid input:focus{border-color:#6366F1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.upload-field{margin-top:14px}
.upload-field .label-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.upload-preview{width:100%;max-width:200px;aspect-ratio:1;background:#F3F4F6;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;border:1.5px dashed #E5E7EB;transition:all .2s}
.upload-preview:hover{border-color:#6366F1}
.upload-preview img{width:100%;height:100%;object-fit:cover}
.upload-preview .preview-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:12px;text-align:center}
.upload-preview.has-image{border-style:solid}
.upload-preview.has-image .preview-placeholder{display:none}
.upload-remove{font-size:11px;color:#EF4444;cursor:pointer;display:none}
.upload-remove.visible{display:inline}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.toolbar input[type=text]{flex:1;min-width:160px;padding:9px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#F9FAFB;transition:all .2s}
.toolbar input[type=text]:focus{border-color:#6366F1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:1.5px solid #E5E7EB;background:#fff;color:#374151;transition:all .2s;outline:none;white-space:nowrap}
.btn:hover{background:#F9FAFB}
.btn.active{background:#EEF2FF;border-color:#6366F1;color:#6366F1}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(99,102,241,.25)}
.btn-danger{color:#EF4444;border-color:#FECACA}
.btn-danger:hover{background:#FEF2F2;border-color:#EF4444}
.btn-success{background:#10B981;color:#fff;border:none}
.btn-success:hover{background:#059669}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;padding:10px 12px;background:#F9FAFB;font-weight:500;color:#6B7280;font-size:12px;border-bottom:1px solid #F3F4F6;white-space:nowrap}
table td{padding:12px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
table tr:hover{background:#F9FAFB}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-checked{background:#D1FAE5;color:#065F46}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 20px;color:#9CA3AF;font-size:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#065F46}
.toast.error{background:#991B1B}
.count-info{font-size:12px;color:#9CA3AF;margin-top:6px}
.hidden-input{display:none}
.voice-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;margin-bottom:16px}
.voice-bar .voice-status{font-size:13px;color:#065F46;flex:1}
.voice-bar .voice-last{font-size:11px;color:#6B7280}
.voice-bar .btn-voice{padding:6px 14px;font-size:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:640px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .toolbar{flex-direction:column;align-items:stretch}
}
</style>
<script>
var qrcode = function() {
/**
* qrcode
* @param typeNumber 1 to 40
* @param errorCorrectionLevel 'L','M','Q','H'
*/
var qrcode = function(typeNumber, errorCorrectionLevel) {
var PAD0 = 0xEC;
var PAD1 = 0x11;
var _typeNumber = typeNumber;
var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
var _modules = null;
var _moduleCount = 0;
var _dataCache = null;
var _dataList = [];
var _this = {};
var makeImpl = function(test, maskPattern) {
_moduleCount = _typeNumber * 4 + 17;
_modules = function(moduleCount) {
var modules = new Array(moduleCount);
for (var row = 0; row < moduleCount; row += 1) {
modules[row] = new Array(moduleCount);
for (var col = 0; col < moduleCount; col += 1) {
modules[row][col] = null;
}
}
return modules;
}(_moduleCount);
setupPositionProbePattern(0, 0);
setupPositionProbePattern(_moduleCount - 7, 0);
setupPositionProbePattern(0, _moduleCount - 7);
setupPositionAdjustPattern();
setupTimingPattern();
setupTypeInfo(test, maskPattern);
if (_typeNumber >= 7) {
setupTypeNumber(test);
}
if (_dataCache == null) {
_dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
}
mapData(_dataCache, maskPattern);
};
var setupPositionProbePattern = function(row, col) {
for (var r = -1; r <= 7; r += 1) {
if (row + r <= -1 || _moduleCount <= row + r) continue;
for (var c = -1; c <= 7; c += 1) {
if (col + c <= -1 || _moduleCount <= col + c) continue;
if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
|| (0 <= c && c <= 6 && (r == 0 || r == 6) )
|| (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
_modules[row + r][col + c] = true;
} else {
_modules[row + r][col + c] = false;
}
}
}
};
var getBestMaskPattern = function() {
var minLostPoint = 0;
var pattern = 0;
for (var i = 0; i < 8; i += 1) {
makeImpl(true, i);
var lostPoint = QRUtil.getLostPoint(_this);
if (i == 0 || minLostPoint > lostPoint) {
minLostPoint = lostPoint;
pattern = i;
}
}
return pattern;
};
var setupTimingPattern = function() {
for (var r = 8; r < _moduleCount - 8; r += 1) {
if (_modules[r][6] != null) {
continue;
}
_modules[r][6] = (r % 2 == 0);
}
for (var c = 8; c < _moduleCount - 8; c += 1) {
if (_modules[6][c] != null) {
continue;
}
_modules[6][c] = (c % 2 == 0);
}
};
var setupPositionAdjustPattern = function() {
var pos = QRUtil.getPatternPosition(_typeNumber);
for (var i = 0; i < pos.length; i += 1) {
for (var j = 0; j < pos.length; j += 1) {
var row = pos[i];
var col = pos[j];
if (_modules[row][col] != null) {
continue;
}
for (var r = -2; r <= 2; r += 1) {
for (var c = -2; c <= 2; c += 1) {
if (r == -2 || r == 2 || c == -2 || c == 2
|| (r == 0 && c == 0) ) {
_modules[row + r][col + c] = true;
} else {
_modules[row + r][col + c] = false;
}
}
}
}
}
};
var setupTypeNumber = function(test) {
var bits = QRUtil.getBCHTypeNumber(_typeNumber);
for (var i = 0; i < 18; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
_modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
}
for (var i = 0; i < 18; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
_modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
}
};
var setupTypeInfo = function(test, maskPattern) {
var data = (_errorCorrectionLevel << 3) | maskPattern;
var bits = QRUtil.getBCHTypeInfo(data);
for (var i = 0; i < 15; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
if (i < 6) {
_modules[i][8] = mod;
} else if (i < 8) {
_modules[i + 1][8] = mod;
} else {
_modules[_moduleCount - 15 + i][8] = mod;
}
}
for (var i = 0; i < 15; i += 1) {
var mod = (!test && ( (bits >> i) & 1) == 1);
if (i < 8) {
_modules[8][_moduleCount - i - 1] = mod;
} else if (i < 9) {
_modules[8][15 - i - 1 + 1] = mod;
} else {
_modules[8][15 - i - 1] = mod;
}
}
_modules[_moduleCount - 8][8] = (!test);
};
var mapData = function(data, maskPattern) {
var inc = -1;
var row = _moduleCount - 1;
var bitIndex = 7;
var byteIndex = 0;
var maskFunc = QRUtil.getMaskFunction(maskPattern);
for (var col = _moduleCount - 1; col > 0; col -= 2) {
if (col == 6) col -= 1;
while (true) {
for (var c = 0; c < 2; c += 1) {
if (_modules[row][col - c] == null) {
var dark = false;
if (byteIndex < data.length) {
dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
}
var mask = maskFunc(row, col - c);
if (mask) {
dark = !dark;
}
_modules[row][col - c] = dark;
bitIndex -= 1;
if (bitIndex == -1) {
byteIndex += 1;
bitIndex = 7;
}
}
}
row += inc;
if (row < 0 || _moduleCount <= row) {
row -= inc;
inc = -inc;
break;
}
}

};
var createBytes = function(buffer, rsBlocks) {
var offset = 0;
var maxDcCount = 0;
var maxEcCount = 0;
var dcdata = new Array(rsBlocks.length);
var ecdata = new Array(rsBlocks.length);
for (var r = 0; r < rsBlocks.length; r += 1) {
var dcCount = rsBlocks[r].dataCount;
var ecCount = rsBlocks[r].totalCount - dcCount;

maxEcCount = Math.max(maxEcCount, ecCount);
dcdata[r] = new Array(dcCount);
for (var i = 0; i < dcdata[r].length; i += 1) {
dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];

offset += dcCount;
var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
var modPoly = rawPoly.mod(rsPoly);
ecdata[r] = new Array(rsPoly.getLength() - 1);
for (var i = 0; i < ecdata[r].length; i += 1) {
var modIndex = i + modPoly.getLength() - ecdata[r].length;
ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
}
}
var totalCodeCount = 0;
for (var i = 0; i < rsBlocks.length; i += 1) {
totalCodeCount += rsBlocks[i].totalCount;
}
var data = new Array(totalCodeCount);
var index = 0;
for (var i = 0; i < maxDcCount; i += 1) {
for (var r = 0; r < rsBlocks.length; r += 1) {
if (i < dcdata[r].length) {
data[index] = dcdata[r][i];
index += 1;
}
}
}
for (var i = 0; i < maxEcCount; i += 1) {
for (var r = 0; r < rsBlocks.length; r += 1) {
if (i < ecdata[r].length) {
data[index] = ecdata[r][i];
index += 1;
}
}
}
return data;
};
var createData = function(typeNumber, errorCorrectionLevel, dataList) {
var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
var buffer = qrBitBuffer();
for (var i = 0; i < dataList.length; i += 1) {
var data = dataList[i];
buffer.put(data.getMode(), 4);
buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
data.write(buffer);
}
var totalDataCount = 0;
for (var i = 0; i < rsBlocks.length; i += 1) {
totalDataCount += rsBlocks[i].dataCount;
}
if (buffer.getLengthInBits() > totalDataCount * 8) {
throw 'code length overflow. ('
+ buffer.getLengthInBits()
+ '>'
+ totalDataCount * 8
+ ')';
}
if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
buffer.put(0, 4);
}
while (buffer.getLengthInBits() % 8 != 0) {
buffer.putBit(false);
}
while (true) {
if (buffer.getLengthInBits() >= totalDataCount * 8) {
break;
}
buffer.put(PAD0, 8);
if (buffer.getLengthInBits() >= totalDataCount * 8) {
break;
}
buffer.put(PAD1, 8);
}
return createBytes(buffer, rsBlocks);
};
_this.addData = function(data, mode) {
mode = mode || 'Byte';
var newData = null;
switch(mode) {
case 'Numeric' :
newData = qrNumber(data);
break;
case 'Alphanumeric' :
newData = qrAlphaNum(data);
break;
case 'Byte' :
newData = qr8BitByte(data);
break;
case 'Kanji' :
newData = qrKanji(data);
break;
default :
throw 'mode:' + mode;
}
_dataList.push(newData);
_dataCache = null;
};
_this.isDark = function(row, col) {
if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
throw row + ',' + col;
}
return _modules[row][col];
};
_this.getModuleCount = function() {
return _moduleCount;
};
_this.make = function() {
if (_typeNumber < 1) {
var typeNumber = 1;
for (; typeNumber < 40; typeNumber++) {
var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
var buffer = qrBitBuffer();
for (var i = 0; i < _dataList.length; i++) {
var data = _dataList[i];
buffer.put(data.getMode(), 4);
buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
data.write(buffer);
}
var totalDataCount = 0;
for (var i = 0; i < rsBlocks.length; i++) {
totalDataCount += rsBlocks[i].dataCount;
}
if (buffer.getLengthInBits() <= totalDataCount * 8) {
break;
}
}
_typeNumber = typeNumber;
}
makeImpl(false, getBestMaskPattern() );
};
_this.createTableTag = function(cellSize, margin) {
cellSize = cellSize || 2;
margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

qrHtml += ' border-width: 0px; border-style: none;';
qrHtml += ' border-collapse: collapse;';
qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
qrHtml += '">';
qrHtml += '<tbody>';
for (var r = 0; r < _this.getModuleCount(); r += 1) {
qrHtml += '<tr>';
for (var c = 0; c < _this.getModuleCount(); c += 1) {
qrHtml += '<td style="';
qrHtml += ' border-width: 0px; border-style: none;';
qrHtml += ' border-collapse: collapse;';
qrHtml += ' padding: 0px; margin: 0px;';
qrHtml += ' width: ' + cellSize + 'px;';
qrHtml += ' height: ' + cellSize + 'px;';
qrHtml += ' background-color: ';
qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
qrHtml += ';';
qrHtml += '"/>';
}
qrHtml += '</tr>';
}
qrHtml += '</tbody>';
qrHtml += '</table>';
return qrHtml;
};

margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
alt = (typeof alt === 'string') ? {text: alt} : alt || {};

alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

title.text = title.text || null;
title.id = (title.text) ? title.id || 'qrcode-title' : null;

' -' + cellSize + ',0 0,-' + cellSize + 'z ';

qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
qrSvg += '>';
qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
escapeXml(title.text) + '</title>' : '';

escapeXml(alt.text) + '</description>' : '';

};
_this.createImgTag = function(cellSize, margin, alt) {
cellSize = cellSize || 2;
margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

img += _this.createDataURL(cellSize, margin);
img += '"';
img += '\u0020width="';
img += size;
img += '"';
img += '\u0020height="';
img += size;
img += '"';

img += '\u0020alt="';
img += escapeXml(alt);
img += '"';
}
img += '/>';

};
var escapeXml = function(s) {
var escaped = '';
for (var i = 0; i < s.length; i += 1) {
var c = s.charAt(i);
switch(c) {
case '<': escaped += '&lt;'; break;
case '>': escaped += '&gt;'; break;
case '&': escaped += '&amp;'; break;
case '"': escaped += '&quot;'; break;

};
var _createHalfASCII = function(margin) {
var cellSize = 1;
margin = (typeof margin == 'undefined')? cellSize * 2 : margin;
var size = _this.getModuleCount() * cellSize + margin * 2;
var min = margin;
var max = size - margin;
var y, x, r1, r2, p;
var blocks = {
'██': '█',
'█ ': '▀',
' █': '▄',
'  ': ' '
};

'██': '▀',
'█ ': '▀',
' █': ' ',
'  ': ' '
};

r2 = Math.floor((y + 1 - min) / cellSize);

p = ' ';
}
if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
p += ' ';
}

p += '█';
}

ascii += '\n';
}

};
_this.createASCII = function(cellSize, margin) {
cellSize = cellSize || 1;
if (cellSize < 2) {

}
cellSize -= 1;
margin = (typeof margin == 'undefined')? cellSize * 2 : margin;
var size = _this.getModuleCount() * cellSize + margin * 2;
var min = margin;

<div class="header">

<div class="container">

      </div>
      <div class="field">
        <label>活动日期</label>
        <input type="text" id="cfg-date" placeholder="如：2026-09-19">
      </div>
      <div class="field">
        <label>具体时间</label>
        <input type="text" id="cfg-time" placeholder="如：14:00-17:30">
      </div>
      <div class="field">
        <label>活动地点</label>

      </div>
    </div>

        <img id="cfg-banner-img" src="" alt="" style="display:none">

      <input type="file" id="cfg-banner-file" accept="image/*" style="display:none">
    </div>

      <div class="label-row">

  // ── Voice Announcement ──
  window.toggleVoice = function(){
    voiceEnabled = !voiceEnabled;
    var btn = document.getElementById('btn-voice-toggle');
    var status = document.getElementById('voice-status');
    var indicator = document.getElementById('voice-indicator');
    if(voiceEnabled){
      btn.textContent = '关闭播报';

      indicator.classList.add('active');
      showToast('语音播报已开启','success');
    } else {
      btn.textContent = '开启播报';
      status.innerHTML = '&#128263; 语音播报：已关闭';
      indicator.classList.remove('active');
      showToast('语音播报已关闭','error');
    }
  };

  window.testVoice = function(){
    speak('测试播报：尾号8888的朋友，签到成功！');
  };

  function announceNewCheckins(oldList, newList){
    if(!voiceEnabled) return;
    if(!oldList || !newList) return;
    var oldChecked = {};
    oldList.forEach(function(r){
      if(r.checkinStatus === 'checked_in') oldChecked[r.id] = true;
    });
    var newChecked = [];
    newList.forEach(function(r){
      if(r.checkinStatus === 'checked_in' && !oldChecked[r.id] && !announcedCheckins[r.id]){
        newChecked.push(r);
        announcedCheckins[r.id] = true;
      }
    });
    if(newChecked.length === 0) return;

    // Also sync announcedCheckins from localStorage to survive page refresh
    try{ localStorage.setItem('_announced_checkins', JSON.stringify(announcedCheckins)); }catch(e){}

    // Speak each new check-in
    newChecked.forEach(function(r, idx){
      setTimeout(function(){
        var tail = r.phone ? r.phone.slice(-4) : '未知';
        speak('尾号' + tail + '的朋友，签到成功！');
      }, idx * 3000); // Stagger announcements
    });

    // Update last announcement time
    var now = new Date();
    var ts = now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes()+':'+(now.getSeconds()<10?'0':'')+now.getSeconds();
    document.getElementById('voice-last').textContent = '最近播报：'+ts;
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    // Cancel any ongoing speech
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.9;
    utter.pitch = 1.1;
    utter.volume = 1;
    // Try to find a Chinese voice
    var voices = window.speechSynthesis.getVoices();
    for(var i=0; i<voices.length; i++){
      if(voices[i].lang.indexOf('zh') === 0){
        utter.voice = voices[i];
        break;
      }
    }
    window.speechSynthesis.speak(utter);
  }

  // ── Config ──
  function getConfig(){
    try{ return JSON.parse(localStorage.getItem('meeting_config') || '{}'); }catch(e){ return {}; }
  }
  function setConfig(c){ localStorage.setItem('meeting_config',JSON.stringify(c)); }

  function getRegistrations(){
    try{ return JSON.parse(localStorage.getItem('meeting_registrations') || '[]'); }catch(e){ return []; }
  }
  function saveRegistrations(list){
    localStorage.setItem('meeting_registrations', JSON.stringify(list));
    var config = getConfig();
    _cloud.push({ registrations: list, config: config, updatedAt: new Date().toISOString() })
      .catch(function(e){ console.log('Cloud push skipped:', e.message); });
  }

  function syncFromCloud(){
    _cloud.fetch().then(function(cloud){
      if(!cloud || !cloud.registrations) return;
      localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
      if(cloud.config){
        var localCfg = getConfig();
        for(var k in cloud.config) localCfg[k] = cloud.config[k];
        localStorage.setItem('meeting_config', JSON.stringify(localCfg));
        loadConfigForm();
      }
      loadStats();
      loadTable();
      generateEntryQR();
      generateCheckinQR();
      updateEntryQRLabel();
      showToast('云端数据已同步','success');
    }).catch(function(e){
      showToast('云端同步失败: '+e.message, 'error');
    });
  }

  function loadFromCloudFirst(){
    _cloud.fetch().then(function(cloud){
      if(cloud && cloud.registrations){
        localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
        if(cloud.config){
          localStorage.setItem('meeting_config', JSON.stringify(cloud.config));
          loadConfigForm();
          if(cloud.config.entryUrl) document.getElementById('entry-url-override').value = cloud.config.entryUrl;
          generateEntryQR();
          generateCheckinQR();
          updateEntryQRLabel();
        }
      }
      // Restore announced checkins
      try{
        var saved = JSON.parse(localStorage.getItem('_announced_checkins') || '{}');
        announcedCheckins = saved;
      }catch(e){}
      loadStats();
      loadTable();
    }).catch(function(e){
      console.log('Cloud load failed:', e.message);
      loadStats();
      loadTable();
    });
  }

  function bindWechatUpload(){
    document.getElementById('cfg-wechat-file').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      if(!file.type.match(/image\//)){ showToast('请选择图片文件','error'); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var maxW = 800;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          var config = getConfig();
          config.wechatQRCode = dataUrl;
          setConfig(config);
          loadWechatPreview(config);
          showToast('微信客服二维码已保存','success');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

    document.getElementById('cfg-wechat-remove').addEventListener('click', function(e){
      e.stopPropagation();
      var config = getConfig();

  function loadStats(){
    var list = getRegistrations();
    var total = list.length;
    var checked = list.filter(function(r){ return r.checkinStatus === 'checked_in'; }).length;
    var pending = total - checked;
    var rate = total > 0 ? Math.round(checked/total*100) : 0;

    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">报名总数</div></div>'+
      '<div class="stat-card success"><div class="stat-num">'+checked+'</div><div class="stat-label">已签到</div></div>'+
      '<div class="stat-card accent"><div class="stat-num">'+pending+'</div><div class="stat-label">待签到</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+rate+'%</div><div class="stat-label">签到率</div></div>';
  }

    var container = document.getElementById('table-container');
    var info = document.getElementById('count-info');

    if(list.length === 0){
      container.innerHTML = '<div class="empty">暂无报名数据</div>';
      info.textContent = '';
      return;
    }

    var html = '<table><thead><tr>'+
      '<th>报名编号</th><th>姓名</th><th>手机号</th><th>单位/公司</th><th>引荐人</th>'+
      '<th>报名时间</th><th>签到状态</th><th>签到时间</th><th>操作</th>'+
      '</tr></thead><tbody>';

    list.forEach(function(r, i){

  window._deleteReg = function(id){
    if(!confirm('确定要删除该报名记录吗？此操作不可恢复！')) return;
    var list = getRegistrations();
    list = list.filter(function(r){ return r.id !== id; });
    saveRegistrations(list);
    loadStats();
    loadTable();
    showToast('已删除','success');
  };

  function getFilteredList(){
    var list = getRegistrations();
    if(currentFilter === 'pending'){
      list = list.filter(function(r){ return r.checkinStatus !== 'checked_in'; });
    }else if(currentFilter === 'checked'){
      list = list.filter(function(r){ return r.checkinStatus === 'checked_in'; });
    }
    if(currentSearch){
      var s = currentSearch.toLowerCase();
      list = list.filter(function(r){
        return (r.name||'').toLowerCase().includes(s) ||
               (r.phone||'').includes(s) ||
               (r.company||'').toLowerCase().includes(s) ||
               (r.id||'').toLowerCase().includes(s);
      });
    }
    list.sort(function(a,b){ return new Date(b.registerTime) - new Date(a.registerTime); });
    return list;
  }

  function exportExcel(){

    if(list.length === 0){ showToast('没有数据可导出','error'); return; }
    var data = list.map(function(r){
      return {
        '报名编号': r.id,
        '姓名': r.name,
        '手机号': r.phone,
        '单位/公司': r.company,
        '引荐人': r.position || '',
        '报名时间': fmtTime(r.registerTime),
        '签到状态': r.checkinStatus === 'checked_in' ? '已签到' : '待签到',
        '签到时间': r.checkinTime ? fmtTime(r.checkinTime) : ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '报名数据');
    var config = getConfig();
    var fname = (config.eventName || '活动') + '_报名签到数据.xlsx';
    XLSX.writeFile(wb, fname);
    showToast('Excel已导出','success');
  }

  function exportJSON(){
    var list = getRegistrations();
    if(list.length === 0){ showToast('没有数据可导出','error'); return; }
    var config = getConfig();
    var blob = new Blob([JSON.stringify({ config: config, registrations: list }, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (config.eventName||'活动')+'_数据备份.json';

  function importJSON(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var d = JSON.parse(ev.target.result);
        if(!d.registrations || !Array.isArray(d.registrations)){
          showToast('数据格式不正确','error'); return;
        }
        if(!confirm('导入将覆盖当前所有报名数据，确定继续吗？')) return;
        saveRegistrations(d.registrations);
        if(d.config){ setConfig(d.config); loadConfigForm(); }
        loadStats();
        loadTable();
        showToast('成功导入 '+d.registrations.length+' 条报名记录','success');
      }catch(ex){
        showToast('文件解析失败: '+ex.message,'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function clearAll(){
    if(!confirm('确定要清空全部报名数据吗？此操作不可恢复！\n建议先导出备份。')) return;
    if(!confirm('再次确认：真的要清空吗？')) return;
    saveRegistrations([]);
    loadStats();
    loadTable();
    showToast('全部数据已清空','success');

  function fmtTime(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    var m = d.getMonth()+1;
    var dd = d.getDate();
    var h = d.getHours();
    var mi = d.getMinutes();
    return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(dd<10?'0'+dd:dd)+' '+(h<10?'0'+h:h)+':'+(mi<10?'0'+mi:mi);
  }

  function esc(s){
    if(!s) return '';
    var el = document.createElement('div');
    el.textContent = s;
    return el.innerHTML;
  }

  function showToast(msg, type){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type||'') + ' show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  function renderQR(container, url, color){
    container.innerHTML = '';
    // 纯前端生成，零外部依赖
    var draw = function(){
      var qr = qrcode(0, 'H');
      qr.addData(url);
      try { qr.make(); } catch(e){ throw e; }
      var mc = qr.getModuleCount();
      var cs = Math.floor(200 / mc); // cellSize 自适应
      var size = mc * cs;
      var canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.style.width = '200px';
      canvas.style.height = '200px';
      canvas.style.display = 'block';
      canvas.style.borderRadius = '8px';
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      for (var r = 0; r < mc; r++) {
        for (var c = 0; c < mc; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillStyle = color;
            ctx.fillRect(c * cs, r * cs, cs, cs);
          }
        }
      }
      container.appendChild(canvas);
    };
    try { draw(); } catch(e) {
      container.innerHTML = '<div style="width:200px;height:200px;background:#FEF2F2;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#EF4444;font-size:13px;text-align:center;line-height:1.6">生成失败<br/><small style="color:#9CA3AF">请检查URL或刷新重试</small></div>';
    }
  }

  function bindEntryQR(){
    document.getElementById('download-entry-qr').addEventListener('click', function(){
      downloadQR('entry-qr-canvas', '会议报名入口二维码');
    });
  }

  function bindCheckinQR(){
    document.getElementById('download-checkin-qr').addEventListener('click', function(){
      downloadQR('checkin-qr-canvas', '签到处签到二维码');
    });
  }

  function downloadQR(containerId, title){
    var canvas = document.querySelector('#'+containerId+' canvas');
    if(!canvas){
      showToast('二维码尚未生成', 'error');
      return;
    }
    var src = canvas.toDataURL('image/png');

    var w = window.open('');
    if(w){
      w.document.title = title;
      w.document.body.style.cssText = 'margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5';
      w.document.body.innerHTML = '<div style="text-align:center;padding:24px"><img src="'+src+'" style="max-width:300px;height:auto;border:1px solid #e0e0e0;border-radius:8px" /><p style="margin-top:16px;color:#666;font-size:14px">长按图片保存 / 右键另存为</p></div>';
      showToast('二维码已在新窗口打开','success');
      return;
    }

    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:32px;text-align:center;max-width:90%"><h3 style="margin:0 0 16px;color:#1F2937">'+title+'</h3><img src="'+src+'" style="max-width:100%;height:auto;border-radius:8px" /><p style="margin:16px 0 0;color:#6B7280;font-size:13px">长按图片保存 / 右键另存为</p><button style="margin-top:16px;padding:10px 32px;background:#6366F1;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">关闭</button></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) document.body.removeChild(overlay);
    });
    overlay.querySelector('button').addEventListener('click', function(){
      document.body.removeChild(overlay);
    });
    showToast('二维码已展示，长按或右键保存','success');
  }
})();
</script>

</body>
</html>
