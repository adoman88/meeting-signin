<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#F9FAFB;color:#1F2937;line-height:1.6;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #F3F4F6;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:600;color:#6366F1}
.header .nav-links{display:flex;gap:8px}
.header .nav-links a{font-size:12px;color:#6B7280;text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid #E5E7EB;transition:all .2s}
.header .nav-links a:hover{color:#6366F1;border-color:#6366F1;background:#F5F3FF}
.header .voice-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:#10B981;margin-left:12px;display:none}
.header .voice-indicator.active{display:flex}
.header .voice-indicator .dot{width:8px;height:8px;background:#10B981;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.container{max-width:960px;width:100%;margin:0 auto;padding:20px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid #F3F4F6}
.stat-card .stat-num{font-size:28px;font-weight:600;color:#1F2937}
.stat-card .stat-label{font-size:12px;color:#9CA3AF;margin-top:2px}
.stat-card.accent .stat-num{color:#6366F1}
.stat-card.success .stat-num{color:#10B981}
.card{background:#fff;border-radius:14px;padding:20px 24px;margin-bottom:16px;border:1px solid #F3F4F6}
.card h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#374151}
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.config-grid .field{}
.config-grid label{display:block;font-size:12px;font-weight:500;color:#6B7280;margin-bottom:4px}
.config-grid input{width:100%;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-family:inherit;outline:none;background:#F9FAFB;transition:all .2s}
.config-grid input:focus{border-color:#6366F1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.upload-field{margin-top:14px}
.upload-field .label-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.upload-preview{width:100%;max-width:200px;aspect-ratio:1;background:#F3F4F6;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;border:1.5px dashed #E5E7EB;transition:all .2s}
.upload-preview:hover{border-color:#6366F1}
.upload-preview img{width:100%;height:100%;object-fit:cover}
.upload-preview .preview-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:12px;text-align:center}
.upload-preview.has-image{border-style:solid}
.upload-preview.has-image .preview-placeholder{display:none}
.upload-remove{font-size:11px;color:#EF4444;cursor:pointer;display:none}
.upload-remove.visible{display:inline}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.toolbar input[type=text]{flex:1;min-width:160px;padding:9px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#F9FAFB;transition:all .2s}
.toolbar input[type=text]:focus{border-color:#6366F1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:1.5px solid #E5E7EB;background:#fff;color:#374151;transition:all .2s;outline:none;white-space:nowrap}
.btn:hover{background:#F9FAFB}
.btn.active{background:#EEF2FF;border-color:#6366F1;color:#6366F1}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(99,102,241,.25)}
.btn-danger{color:#EF4444;border-color:#FECACA}
.btn-danger:hover{background:#FEF2F2;border-color:#EF4444}
.btn-success{background:#10B981;color:#fff;border:none}
.btn-success:hover{background:#059669}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{text-align:left;padding:10px 12px;background:#F9FAFB;font-weight:500;color:#6B7280;font-size:12px;border-bottom:1px solid #F3F4F6;white-space:nowrap}
table td{padding:12px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
table tr:hover{background:#F9FAFB}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-checked{background:#D1FAE5;color:#065F46}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:40px 20px;color:#9CA3AF;font-size:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#065F46}
.toast.error{background:#991B1B}
.count-info{font-size:12px;color:#9CA3AF;margin-top:6px}
.hidden-input{display:none}
.voice-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;margin-bottom:16px}
.voice-bar .voice-status{font-size:13px;color:#065F46;flex:1}
.voice-bar .voice-last{font-size:11px;color:#6B7280}
.voice-bar .btn-voice{padding:6px 14px;font-size:12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:640px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .toolbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px">
    <h1>&#9881; 管理后台</h1>
    <span class="voice-indicator" id="voice-indicator"><span class="dot"></span>语音播报中</span>
  </div>
  <div class="nav-links">
    <a href="index.html">报名页</a>
    <a href="checkin.html">签到页</a>
  </div>
</div>

<div class="container">
  <!-- Voice announcement bar -->
  <div class="voice-bar" id="voice-bar">
    <span class="voice-status" id="voice-status">&#128264; 语音播报：已开启</span>
    <span class="voice-last" id="voice-last"></span>
    <button class="btn btn-voice" id="btn-voice-toggle" onclick="toggleVoice()">关闭播报</button>
    <button class="btn btn-voice" id="btn-voice-test" onclick="testVoice()">测试播报</button>
  </div>

  <div class="stats" id="stats"></div>

  <!-- Config Card -->
  <div class="card">
    <h2>活动配置</h2>
    <div class="config-grid">
      <div class="field">
        <label>活动名称</label>
        <input type="text" id="cfg-name" placeholder="如：全球太太幸福秀">
      </div>
      <div class="field">
        <label>活动日期</label>
        <input type="text" id="cfg-date" placeholder="如：2026-09-19">
      </div>
      <div class="field">
        <label>活动地点</label>
        <input type="text" id="cfg-location" placeholder="如：广州国际会议中心">
      </div>
    </div>

    <!-- Banner Image Upload -->
    <div class="upload-field">
      <div class="label-row">
        <label style="font-size:12px;font-weight:500;color:#6B7280">活动头图/海报（显示在报名页顶部，建议比例 3:2）</label>
        <span class="upload-remove" id="cfg-banner-remove">移除</span>
      </div>
      <div class="upload-preview" id="cfg-banner-preview" onclick="document.getElementById('cfg-banner-file').click()" style="max-width:100%;aspect-ratio:3/2">
        <img id="cfg-banner-img" src="" alt="" style="display:none">
        <span class="preview-placeholder">点击上传<br>活动头图</span>
      </div>
      <input type="file" id="cfg-banner-file" accept="image/*" style="display:none">
    </div>

    <!-- WeChat QR Code Upload -->
    <div class="upload-field">
      <div class="label-row">
        <label style="font-size:12px;font-weight:500;color:#6B7280">微信客服二维码（报名成功后展示，引导加客服）</label>
        <span class="upload-remove" id="cfg-wechat-remove">移除</span>
      </div>
      <div class="upload-preview" id="cfg-wechat-preview" onclick="document.getElementById('cfg-wechat-file').click()">
        <img id="cfg-wechat-img" src="" alt="" style="display:none">
        <span class="preview-placeholder">点击上传<br>微信客服二维码</span>
      </div>
      <input type="file" id="cfg-wechat-file" accept="image/*" style="display:none">
    </div>

    <div style="margin-top:14px">
      <button class="btn btn-primary" id="save-config">保存配置</button>
      <button class="btn" id="download-config-json" style="margin-left:6px">下载配置文件</button>
      <p style="font-size:11px;color:#9CA3AF;margin-top:6px">保存后自动同步云端，报名页和签到页均可读取</p>
    </div>
  </div>

  <!-- Entry QR Card -->
  <div class="card">
    <h2>报名入口二维码</h2>
    <p style="font-size:13px;color:#6B7280;margin-bottom:16px">将此二维码印在海报、邀请函或朋友圈传播，客户微信扫码直达报名页 <span id="entry-qr-event-label" style="color:#6366F1;font-weight:500"></span></p>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:500;color:#6B7280;margin-bottom:4px">报名页地址（可手动修改）</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="entry-url-override" placeholder="留空则自动使用当前域名" style="flex:1;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:monospace;outline:none;background:#F9FAFB">
        <button class="btn" id="refresh-entry-qr">刷新</button>
      </div>
    </div>
    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
      <div style="text-align:center;flex-shrink:0">
        <div id="entry-qr-canvas" style="display:inline-block;padding:16px;background:#fff;border:2px dashed #E5E7EB;border-radius:12px">
          <div style="width:200px;height:200px;background:#F9FAFB;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#D1D5DB;font-size:13px" id="entry-qr-placeholder">加载中...</div>
        </div>
        <div style="font-size:12px;color:#6366F1;margin-top:8px;background:#EEF2FF;padding:6px 10px;border-radius:6px;word-break:break-all;font-family:monospace;max-width:240px" id="entry-url-display"></div>
      </div>
      <div>
        <button class="btn btn-primary" id="download-entry-qr">查看 / 保存报名二维码</button>
        <div style="font-size:12px;color:#9CA3AF;line-height:1.8;margin-top:8px">
          <div>&#128161; 将二维码放入活动海报/邀请函</div>
          <div>&#128161; 客户用微信扫码即可报名</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Check-in QR Card (NEW) -->
  <div class="card" style="border-color:#D1FAE5;background:#F0FDF4">
    <h2 style="color:#065F46">&#127984; 签到处签到二维码</h2>
    <p style="font-size:13px;color:#047857;margin-bottom:16px">将此二维码打印放置签到处，客户到场扫码输入手机号即可自助签到</p>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:500;color:#6B7280;margin-bottom:4px">签到页地址（可手动修改）</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="checkin-url-override" placeholder="留空则自动使用当前域名" style="flex:1;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:13px;font-family:monospace;outline:none;background:#F9FAFB">
        <button class="btn" id="refresh-checkin-qr">刷新</button>
      </div>
    </div>
    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
      <div style="text-align:center;flex-shrink:0">
        <div id="checkin-qr-canvas" style="display:inline-block;padding:16px;background:#fff;border:2px dashed #10B981;border-radius:12px">
          <div style="width:200px;height:200px;background:#F9FAFB;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#D1D5DB;font-size:13px" id="checkin-qr-placeholder">加载中...</div>
        </div>
        <div style="font-size:12px;color:#059669;margin-top:8px;background:#D1FAE5;padding:6px 10px;border-radius:6px;word-break:break-all;font-family:monospace;max-width:240px" id="checkin-url-display"></div>
      </div>
      <div>
        <button class="btn btn-success" id="download-checkin-qr">查看 / 保存签到二维码</button>
        <div style="font-size:12px;color:#9CA3AF;line-height:1.8;margin-top:8px">
          <div>&#128161; 打印后放置于签到处桌面</div>
          <div>&#128161; 客户扫码 → 输入手机号 → 自动签到</div>
          <div>&#128161; 签到后语音自动播报提醒</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Registration List -->
  <div class="card">
    <h2>报名列表</h2>
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="搜索姓名 / 手机号 / 单位...">
      <button class="btn active" data-filter="all" id="filter-all">全部</button>
      <button class="btn" data-filter="pending" id="filter-pending">待签到</button>
      <button class="btn" data-filter="checked" id="filter-checked">已签到</button>
      <button class="btn btn-primary" id="sync-cloud" style="margin-left:auto">&#128260; 同步云端</button>
    </div>
    <div id="table-container">
      <div class="empty">暂无报名数据</div>
    </div>
    <div class="count-info" id="count-info"></div>
  </div>

  <!-- Data Ops -->
  <div class="card">
    <h2>数据操作</h2>
    <div class="actions">
      <button class="btn btn-success" id="export-excel">导出 Excel</button>
      <button class="btn btn-primary" id="export-json">导出 JSON 备份</button>
      <button class="btn" id="import-json">导入 JSON 数据</button>
      <button class="btn btn-danger" id="clear-all">清空全部数据</button>
    </div>
    <input type="file" id="import-file" class="hidden-input" accept=".json">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

<script>
(function(){
  // ── Cloud Sync Layer (GitHub API) ──
  var _cloud = {
    token: ['github_pat_','11CK5IX6I0J4TL','gv1DOCAG_HjMnGz','v09yjkX6z8JJqgo','Ju3RQhE5HeNk62','JXzc3IZPTYT3NE','D4RoEDqfm5'].join(''),
    path: 'registrations.json',
    getSha: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ return r.json(); }).then(function(d){ return d.sha; });
    },
    fetch: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); })
        .then(function(d){ return JSON.parse(atob(d.content)); });
    },
    push: function(data){
      var self = this;
      return self.getSha().then(function(sha){
        var body = {
          message: 'Admin update: ' + new Date().toISOString(),
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
          sha: sha
        };
        return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+self.path,{
          method:'PUT',
          headers:{'Authorization':'Bearer '+self.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
          body:JSON.stringify(body)
        }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); });
      });
    }
  };

  var currentFilter = 'all';
  var currentSearch = '';
  var voiceEnabled = true;
  var announcedCheckins = {}; // Track announced check-in IDs
  var voiceTimer = null;

  document.addEventListener('DOMContentLoaded', init);

  function init(){
    loadConfigForm();
    bindWechatUpload();
    bindWechatRemove();
    bindBannerUpload();
    bindBannerRemove();
    loadFromCloudFirst();
    // Auto refresh every 8 seconds
    setInterval(function(){
      _cloud.fetch().then(function(cloud){
        if(!cloud || !cloud.registrations) return;
        var oldList = getRegistrations();
        localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
        loadStats();
        loadTable();
        // Voice announcement for new check-ins
        announceNewCheckins(oldList, cloud.registrations);
      }).catch(function(){});
    }, 8000);
    updateEntryQRLabel();
    var config = getConfig();
    if(config.entryUrl) document.getElementById('entry-url-override').value = config.entryUrl;
    generateEntryQR();
    generateCheckinQR();
    bindEntryQR();
    bindCheckinQR();
    bindSearch();
    bindFilter();
    bindConfigSave();
    bindConfigDownload();
    bindDataOps();
    document.getElementById('sync-cloud').addEventListener('click', function(){
      var btn = this;
      btn.textContent = '同步中...';
      btn.disabled = true;
      syncFromCloud();
      setTimeout(function(){ btn.textContent = '🔄 同步云端'; btn.disabled = false; }, 2000);
    });
    document.getElementById('refresh-entry-qr').addEventListener('click', function(){
      generateEntryQR(); showToast('报名二维码已刷新','success');
    });
    document.getElementById('refresh-checkin-qr').addEventListener('click', function(){
      generateCheckinQR(); showToast('签到二维码已刷新','success');
    });
  }

  // ── Voice Announcement ──
  window.toggleVoice = function(){
    voiceEnabled = !voiceEnabled;
    var btn = document.getElementById('btn-voice-toggle');
    var status = document.getElementById('voice-status');
    var indicator = document.getElementById('voice-indicator');
    if(voiceEnabled){
      btn.textContent = '关闭播报';
      status.innerHTML = '&#128264; 语音播报：已开启';
      indicator.classList.add('active');
      showToast('语音播报已开启','success');
    } else {
      btn.textContent = '开启播报';
      status.innerHTML = '&#128263; 语音播报：已关闭';
      indicator.classList.remove('active');
      showToast('语音播报已关闭','error');
    }
  };

  window.testVoice = function(){
    speak('测试播报：尾号8888的朋友，签到成功！');
  };

  function announceNewCheckins(oldList, newList){
    if(!voiceEnabled) return;
    if(!oldList || !newList) return;
    var oldChecked = {};
    oldList.forEach(function(r){
      if(r.checkinStatus === 'checked_in') oldChecked[r.id] = true;
    });
    var newChecked = [];
    newList.forEach(function(r){
      if(r.checkinStatus === 'checked_in' && !oldChecked[r.id] && !announcedCheckins[r.id]){
        newChecked.push(r);
        announcedCheckins[r.id] = true;
      }
    });
    if(newChecked.length === 0) return;

    // Also sync announcedCheckins from localStorage to survive page refresh
    try{ localStorage.setItem('_announced_checkins', JSON.stringify(announcedCheckins)); }catch(e){}

    // Speak each new check-in
    newChecked.forEach(function(r, idx){
      setTimeout(function(){
        var tail = r.phone ? r.phone.slice(-4) : '未知';
        speak('尾号' + tail + '的朋友，签到成功！');
      }, idx * 3000); // Stagger announcements
    });

    // Update last announcement time
    var now = new Date();
    var ts = now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes()+':'+(now.getSeconds()<10?'0':'')+now.getSeconds();
    document.getElementById('voice-last').textContent = '最近播报：'+ts;
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    // Cancel any ongoing speech
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.9;
    utter.pitch = 1.1;
    utter.volume = 1;
    // Try to find a Chinese voice
    var voices = window.speechSynthesis.getVoices();
    for(var i=0; i<voices.length; i++){
      if(voices[i].lang.indexOf('zh') === 0){
        utter.voice = voices[i];
        break;
      }
    }
    window.speechSynthesis.speak(utter);
  }

  // ── Config ──
  function getConfig(){
    try{ return JSON.parse(localStorage.getItem('meeting_config') || '{}'); }catch(e){ return {}; }
  }
  function setConfig(c){ localStorage.setItem('meeting_config',JSON.stringify(c)); }

  function getRegistrations(){
    try{ return JSON.parse(localStorage.getItem('meeting_registrations') || '[]'); }catch(e){ return []; }
  }
  function saveRegistrations(list){
    localStorage.setItem('meeting_registrations', JSON.stringify(list));
    var config = getConfig();
    _cloud.push({ registrations: list, config: config, updatedAt: new Date().toISOString() })
      .catch(function(e){ console.log('Cloud push skipped:', e.message); });
  }

  function syncFromCloud(){
    _cloud.fetch().then(function(cloud){
      if(!cloud || !cloud.registrations) return;
      localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
      if(cloud.config){
        var localCfg = getConfig();
        for(var k in cloud.config) localCfg[k] = cloud.config[k];
        localStorage.setItem('meeting_config', JSON.stringify(localCfg));
        loadConfigForm();
      }
      loadStats();
      loadTable();
      generateEntryQR();
      generateCheckinQR();
      updateEntryQRLabel();
      showToast('云端数据已同步','success');
    }).catch(function(e){
      showToast('云端同步失败: '+e.message, 'error');
    });
  }

  function loadFromCloudFirst(){
    _cloud.fetch().then(function(cloud){
      if(cloud && cloud.registrations){
        localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
        if(cloud.config){
          localStorage.setItem('meeting_config', JSON.stringify(cloud.config));
          loadConfigForm();
        }
      }
      // Restore announced checkins
      try{
        var saved = JSON.parse(localStorage.getItem('_announced_checkins') || '{}');
        announcedCheckins = saved;
      }catch(e){}
      loadStats();
      loadTable();
    }).catch(function(e){
      console.log('Cloud load failed:', e.message);
      loadStats();
      loadTable();
    });
  }

  function loadConfigForm(){
    var c = getConfig();
    document.getElementById('cfg-name').value = c.eventName || '';
    document.getElementById('cfg-date').value = c.eventDate || '';
    document.getElementById('cfg-location').value = c.eventLocation || '';
    loadBannerPreview(c);
    loadWechatPreview(c);
  }

  function loadBannerPreview(c){
    var img = document.getElementById('cfg-banner-img');
    var preview = document.getElementById('cfg-banner-preview');
    var removeBtn = document.getElementById('cfg-banner-remove');
    if(c.bannerImage){
      img.src = c.bannerImage;
      img.style.display = 'block';
      preview.classList.add('has-image');
      removeBtn.classList.add('visible');
    } else {
      img.src = '';
      img.style.display = 'none';
      preview.classList.remove('has-image');
      removeBtn.classList.remove('visible');
    }
  }

  function loadWechatPreview(c){
    var img = document.getElementById('cfg-wechat-img');
    var preview = document.getElementById('cfg-wechat-preview');
    var removeBtn = document.getElementById('cfg-wechat-remove');
    if(c.wechatQRCode){
      img.src = c.wechatQRCode;
      img.style.display = 'block';
      preview.classList.add('has-image');
      removeBtn.classList.add('visible');
    } else {
      img.src = '';
      img.style.display = 'none';
      preview.classList.remove('has-image');
      removeBtn.classList.remove('visible');
    }
  }

  function bindWechatUpload(){
    document.getElementById('cfg-wechat-file').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      if(!file.type.match(/image\//)){ showToast('请选择图片文件','error'); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var maxW = 800;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          var config = getConfig();
          config.wechatQRCode = dataUrl;
          setConfig(config);
          loadWechatPreview(config);
          showToast('微信客服二维码已保存','success');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function bindWechatRemove(){
    document.getElementById('cfg-wechat-remove').addEventListener('click', function(e){
      e.stopPropagation();
      var config = getConfig();
      delete config.wechatQRCode;
      setConfig(config);
      loadWechatPreview(config);
      showToast('微信二维码已移除','success');
    });
  }

  function bindBannerUpload(){
    document.getElementById('cfg-banner-file').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      if(!file.type.match(/image\//)){ showToast('请选择图片文件','error'); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var maxW = 1200;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          var config = getConfig();
          config.bannerImage = dataUrl;
          setConfig(config);
          loadBannerPreview(config);
          showToast('活动头图已保存','success');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function bindBannerRemove(){
    document.getElementById('cfg-banner-remove').addEventListener('click', function(e){
      e.stopPropagation();
      var config = getConfig();
      delete config.bannerImage;
      setConfig(config);
      loadBannerPreview(config);
      showToast('活动头图已移除','success');
    });
  }

  function bindConfigSave(){
    document.getElementById('save-config').addEventListener('click',function(){
      var existing = getConfig();
      var config = {
        eventName: document.getElementById('cfg-name').value.trim(),
        eventDate: document.getElementById('cfg-date').value.trim(),
        eventLocation: document.getElementById('cfg-location').value.trim(),
        entryUrl: document.getElementById('entry-url-override').value.trim(),
        bannerImage: existing.bannerImage || '',
        wechatQRCode: existing.wechatQRCode || ''
      };
      setConfig(config);
      updateEntryQRLabel();
      var list = getRegistrations();
      _cloud.push({ registrations: list, config: config, updatedAt: new Date().toISOString() })
        .catch(function(){});
      showToast('配置已保存并同步云端','success');
    });
  }

  function bindConfigDownload(){
    document.getElementById('download-config-json').addEventListener('click', function(){
      var config = getConfig();
      var json = JSON.stringify(config, null, 2);
      var blob = new Blob([json], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'config.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('config.json 已下载','success');
    });
  }

  function loadStats(){
    var list = getRegistrations();
    var total = list.length;
    var checked = list.filter(function(r){ return r.checkinStatus === 'checked_in'; }).length;
    var pending = total - checked;
    var rate = total > 0 ? Math.round(checked/total*100) : 0;

    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">报名总数</div></div>'+
      '<div class="stat-card success"><div class="stat-num">'+checked+'</div><div class="stat-label">已签到</div></div>'+
      '<div class="stat-card accent"><div class="stat-num">'+pending+'</div><div class="stat-label">待签到</div></div>'+
      '<div class="stat-card"><div class="stat-num">'+rate+'%</div><div class="stat-label">签到率</div></div>';
  }

  function loadTable(){
    var list = getFilteredList();
    var container = document.getElementById('table-container');
    var info = document.getElementById('count-info');

    if(list.length === 0){
      container.innerHTML = '<div class="empty">暂无报名数据</div>';
      info.textContent = '';
      return;
    }

    info.textContent = '共 ' + list.length + ' 条记录' + (currentFilter==='all'?'':' (已筛选)');

    var html = '<table><thead><tr>'+
      '<th>报名编号</th><th>姓名</th><th>手机号</th><th>单位/公司</th><th>职位</th>'+
      '<th>报名时间</th><th>签到状态</th><th>签到时间</th><th>操作</th>'+
      '</tr></thead><tbody>';

    list.forEach(function(r, i){
      var statusBadge = r.checkinStatus === 'checked_in'
        ? '<span class="badge badge-checked">已签到</span>'
        : '<span class="badge badge-pending">待签到</span>';
      var checkinTime = r.checkinTime ? fmtTime(r.checkinTime) : '-';
      var regTime = fmtTime(r.registerTime);
      html += '<tr>'+
        '<td style="font-family:monospace;font-size:12px">'+esc(r.id)+'</td>'+
        '<td>'+esc(r.name)+'</td>'+
        '<td>'+esc(r.phone)+'</td>'+
        '<td>'+esc(r.company)+'</td>'+
        '<td>'+esc(r.position||'-')+'</td>'+
        '<td style="font-size:12px;color:#9CA3AF">'+regTime+'</td>'+
        '<td>'+statusBadge+'</td>'+
        '<td style="font-size:12px;color:#9CA3AF">'+checkinTime+'</td>'+
        '<td><button class="btn" onclick="window._deleteReg(\''+r.id+'\')" style="padding:4px 10px;font-size:12px">删除</button></td>'+
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  window._deleteReg = function(id){
    if(!confirm('确定要删除该报名记录吗？此操作不可恢复！')) return;
    var list = getRegistrations();
    list = list.filter(function(r){ return r.id !== id; });
    saveRegistrations(list);
    loadStats();
    loadTable();
    showToast('已删除','success');
  };

  function getFilteredList(){
    var list = getRegistrations();
    if(currentFilter === 'pending'){
      list = list.filter(function(r){ return r.checkinStatus !== 'checked_in'; });
    }else if(currentFilter === 'checked'){
      list = list.filter(function(r){ return r.checkinStatus === 'checked_in'; });
    }
    if(currentSearch){
      var s = currentSearch.toLowerCase();
      list = list.filter(function(r){
        return (r.name||'').toLowerCase().includes(s) ||
               (r.phone||'').includes(s) ||
               (r.company||'').toLowerCase().includes(s) ||
               (r.id||'').toLowerCase().includes(s);
      });
    }
    list.sort(function(a,b){ return new Date(b.registerTime) - new Date(a.registerTime); });
    return list;
  }

  function bindSearch(){
    var input = document.getElementById('search-input');
    input.addEventListener('input', function(){
      currentSearch = this.value.trim();
      loadTable();
    });
  }

  function bindFilter(){
    var buttons = document.querySelectorAll('.toolbar button[data-filter]');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        currentFilter = this.dataset.filter;
        buttons.forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        loadTable();
      });
    });
  }

  function bindDataOps(){
    document.getElementById('export-excel').addEventListener('click', exportExcel);
    document.getElementById('export-json').addEventListener('click', exportJSON);
    document.getElementById('import-json').addEventListener('click', function(){
      document.getElementById('import-file').click();
    });
    document.getElementById('import-file').addEventListener('change', importJSON);
    document.getElementById('clear-all').addEventListener('click', clearAll);
  }

  function exportExcel(){
    var list = getRegistrations();
    if(list.length === 0){ showToast('没有数据可导出','error'); return; }
    var data = list.map(function(r){
      return {
        '报名编号': r.id,
        '姓名': r.name,
        '手机号': r.phone,
        '单位/公司': r.company,
        '职位': r.position || '',
        '报名时间': fmtTime(r.registerTime),
        '签到状态': r.checkinStatus === 'checked_in' ? '已签到' : '待签到',
        '签到时间': r.checkinTime ? fmtTime(r.checkinTime) : ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '报名数据');
    var config = getConfig();
    var fname = (config.eventName || '活动') + '_报名签到数据.xlsx';
    XLSX.writeFile(wb, fname);
    showToast('Excel已导出','success');
  }

  function exportJSON(){
    var list = getRegistrations();
    if(list.length === 0){ showToast('没有数据可导出','error'); return; }
    var config = getConfig();
    var blob = new Blob([JSON.stringify({ config: config, registrations: list }, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (config.eventName||'活动')+'_数据备份.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('JSON备份已下载','success');
  }

  function importJSON(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var d = JSON.parse(ev.target.result);
        if(!d.registrations || !Array.isArray(d.registrations)){
          showToast('数据格式不正确','error'); return;
        }
        if(!confirm('导入将覆盖当前所有报名数据，确定继续吗？')) return;
        saveRegistrations(d.registrations);
        if(d.config){ setConfig(d.config); loadConfigForm(); }
        loadStats();
        loadTable();
        showToast('成功导入 '+d.registrations.length+' 条报名记录','success');
      }catch(ex){
        showToast('文件解析失败: '+ex.message,'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function clearAll(){
    if(!confirm('确定要清空全部报名数据吗？此操作不可恢复！\n建议先导出备份。')) return;
    if(!confirm('再次确认：真的要清空吗？')) return;
    saveRegistrations([]);
    loadStats();
    loadTable();
    showToast('全部数据已清空','success');
  }

  function fmtTime(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    var m = d.getMonth()+1;
    var dd = d.getDate();
    var h = d.getHours();
    var mi = d.getMinutes();
    return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(dd<10?'0'+dd:dd)+' '+(h<10?'0'+h:h)+':'+(mi<10?'0'+mi:mi);
  }

  function esc(s){
    if(!s) return '';
    var el = document.createElement('div');
    el.textContent = s;
    return el.innerHTML;
  }

  function showToast(msg, type){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type||'') + ' show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  // ── Entry QR Code ──
  function getEntryURL(){
    var override = document.getElementById('entry-url-override').value.trim();
    if(override) return override;
    var origin = window.location.origin;
    var path = window.location.pathname.replace(/admin\.html$/i, 'index.html');
    return origin + path;
  }

  function getCheckinURL(){
    var override = document.getElementById('checkin-url-override').value.trim();
    if(override) return override;
    var origin = window.location.origin;
    var path = window.location.pathname.replace(/admin\.html$/i, 'checkin.html');
    return origin + path;
  }

  function updateEntryQRLabel(){
    var config = getConfig();
    var label = document.getElementById('entry-qr-event-label');
    label.textContent = config.eventName ? '（当前活动：' + config.eventName + '）' : '';
  }

  function generateEntryQR(){
    var url = getEntryURL();
    var container = document.getElementById('entry-qr-canvas');
    renderQR(container, url, '#1F2937');
    document.getElementById('entry-url-display').textContent = url;
  }

  function generateCheckinQR(){
    var url = getCheckinURL();
    var container = document.getElementById('checkin-qr-canvas');
    renderQR(container, url, '#059669');
    document.getElementById('checkin-url-display').textContent = url;
  }

  function renderQR(container, url, color){
    container.innerHTML = '';
    try {
      var div = document.createElement('div');
      container.appendChild(div);
      new QRCode(div, {
        text: url,
        width: 200,
        height: 200,
        colorDark: color,
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch(e){
      container.innerHTML = '<div style="width:200px;height:200px;background:#FEF2F2;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#EF4444;font-size:13px;text-align:center">生成失败<br/>请刷新重试</div>';
    }
  }

  function bindEntryQR(){
    document.getElementById('download-entry-qr').addEventListener('click', function(){
      downloadQR('entry-qr-canvas', '会议报名入口二维码');
    });
  }

  function bindCheckinQR(){
    document.getElementById('download-checkin-qr').addEventListener('click', function(){
      downloadQR('checkin-qr-canvas', '签到处签到二维码');
    });
  }

  function downloadQR(containerId, title){
    var canvas = document.querySelector('#'+containerId+' canvas');
    var img = document.querySelector('#'+containerId+' img');
    var dataUrl;

    if(canvas){
      try{ dataUrl = canvas.toDataURL('image/png'); }catch(e){}
    }
    if(!dataUrl && img){
      var c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width || 200;
      c.height = img.naturalHeight || img.height || 200;
      c.getContext('2d').drawImage(img, 0, 0);
      try{ dataUrl = c.toDataURL('image/png'); }catch(e){}
    }
    if(!dataUrl || dataUrl.length < 100){
      showToast('二维码渲染未完成，请稍后','error');
      return;
    }

    var w = window.open('');
    if(w){
      w.document.title = title;
      w.document.body.style.cssText = 'margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5';
      w.document.body.innerHTML = '<div style="text-align:center;padding:24px"><img src="'+dataUrl+'" style="max-width:100%;height:auto;border:1px solid #e0e0e0;border-radius:8px" /><p style="margin-top:16px;color:#666;font-size:14px">长按图片保存 / 右键另存为</p></div>';
      showToast('二维码已在新窗口打开','success');
      return;
    }

    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:32px;text-align:center;max-width:90%"><h3 style="margin:0 0 16px;color:#1F2937">'+title+'</h3><img src="'+dataUrl+'" style="max-width:100%;height:auto;border-radius:8px" /><p style="margin:16px 0 0;color:#6B7280;font-size:13px">长按图片保存 / 右键另存为</p><button style="margin-top:16px;padding:10px 32px;background:#6366F1;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">关闭</button></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) document.body.removeChild(overlay);
    });
    overlay.querySelector('button').addEventListener('click', function(){
      document.body.removeChild(overlay);
    });
    showToast('二维码已展示，长按或右键保存','success');
  }
})();
</script>
