<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码报名</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#EEF2FF 0%,#FDF2F8 50%,#F0F9FF 100%);color:#1F2937;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.banner-area{width:100%;max-width:420px;margin:0 auto;display:none}
.banner-area.visible{display:block}
.banner-wrapper{width:100%;padding-top:40%;position:relative;background:#F3F4F6;overflow:hidden}
.banner-wrapper img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.event-theme-area{text-align:center;padding:14px 16px 6px;display:none}
.event-theme-area.visible{display:block}
.event-theme-name{font-size:18px;font-weight:700;color:#6366F1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.event-theme-subtitle{font-size:12px;color:#4D4D4D;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.container{flex:1;max-width:420px;width:100%;margin:0 auto;padding:0 16px}
.steps-bar{max-width:700px;margin:0 auto 5px;padding:4px 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.steps-bar .step-text{font-size:12px;color:#6366F1;font-weight:500;white-space:nowrap}
.steps-bar .arrow{color:#C4B5FD;font-size:11px;flex-shrink:0}
.event-info-bar{text-align:center;font-size:11px;color:#9CA3AF;padding:0 16px 10px;display:none}
.event-info-bar.visible{display:block}
.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid #F3F4F6}
.card h2{font-size:17px;font-weight:600;margin-bottom:20px;color:#374151}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:6px}
.form-group label .required{color:#EF4444;margin-left:2px}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;font-family:inherit;color:#1F2937;background:#F9FAFB;transition:all .2s;outline:none}
.form-group input:focus{border-color:#6366F1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-group input.error{border-color:#EF4444;background:#FEF2F2}
.form-group .hint{font-size:12px;color:#9CA3AF;margin-top:4px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;outline:none}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{background:#D1D5DB;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1.5px solid #E5E7EB;color:#6366F1;margin-top:8px}
.btn-outline:hover{background:#F5F3FF;border-color:#6366F1}
/* Success section */
.success-section{display:none}
.success-section.active{display:block}
#form-section.hidden{display:none}
.success-header{text-align:center;margin-bottom:20px}
.success-header .check-icon{width:64px;height:64px;background:linear-gradient(135deg,#10B981,#34D399);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:32px;color:#fff}
.success-header h2{font-size:20px;color:#1F2937;margin-bottom:4px}
.success-header p{font-size:13px;color:#6B7280}
/* WeChat QR Modal */
.wechat-modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:2000;align-items:center;justify-content:center}
.wechat-modal-overlay.show{display:flex}
.wechat-modal{background:#fff;border-radius:20px;padding:32px 24px 24px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadeInUp .35s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.wechat-modal .modal-icon{width:56px;height:56px;background:#ECFDF5;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.wechat-modal h3{font-size:18px;color:#1F2937;margin-bottom:6px}
.wechat-modal .modal-sub{font-size:13px;color:#6B7280;margin-bottom:20px;line-height:1.6}
.wechat-modal .wechat-qr-img{width:180px;height:180px;margin:0 auto 16px;border-radius:12px;overflow:hidden;background:#F3F4F6;display:flex;align-items:center;justify-content:center}
.wechat-modal .wechat-qr-img img{width:100%;height:100%;object-fit:contain}
.wechat-modal .wechat-qr-img .no-qr{font-size:13px;color:#9CA3AF;text-align:center;padding:20px}
.wechat-modal .qr-tip{font-size:12px;color:#9CA3AF;margin-bottom:16px}
.wechat-modal .qr-tip strong{display:block;font-size:14px;color:#374151;margin-bottom:4px}
.wechat-modal .btn-close-modal{display:block;width:100%;padding:12px;background:#07C160;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.wechat-modal .btn-close-modal:hover{background:#06AD56}
.wechat-modal .btn-skip{display:block;width:100%;padding:10px;background:transparent;color:#9CA3AF;border:none;font-size:13px;cursor:pointer;margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#065F46}
.toast.error{background:#991B1B}
.footer{text-align:center;padding:24px;font-size:12px;color:#9CA3AF}
</style>
</head>
<body>

<div class="banner-area" id="banner-area">
  <div class="banner-wrapper">
    <img id="banner-img" src="" alt="">
  </div>
</div>

<div class="event-theme-area" id="event-theme-area">
  <div class="event-theme-name" id="event-theme-name"></div>
  <div class="event-theme-subtitle" id="event-theme-subtitle"></div>
</div>

<div class="container">
  <div class="steps-bar">
    <span class="step-text">填写报名信息</span>
    <span class="arrow">&#10132;</span>
    <span class="step-text">提交</span>
    <span class="arrow">&#10132;</span>
    <span class="step-text">添加客服微信</span>
    <span class="arrow">&#10132;</span>
    <span class="step-text">报名成功</span>
  </div>
  <div class="event-info-bar" id="event-info-bar"></div>

  <div id="form-section">
    <div class="card">
      <h2>填写报名信息</h2>
      <form id="reg-form" novalidate>
        <div class="form-group">
          <label>姓名<span class="required">*</span></label>
          <input type="text" id="name" placeholder="请输入您的姓名" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label>手机号<span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="请输入11位手机号" autocomplete="tel" required maxlength="11">
          <p class="hint">用于接收报名确认及签到验证</p>
        </div>
        <div class="form-group">
          <label>单位/公司<span class="required">*</span></label>
          <input type="text" id="company" placeholder="请输入单位或公司名称" required>
        </div>
        <div class="form-group">
          <label>引荐人<span class="required">*</span></label>
          <input type="text" id="position" placeholder="请输入引荐人姓名" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">立即报名</button>
      </form>
    </div>
  </div>

  <div class="success-section" id="success-section">
    <div class="card">
      <div class="success-header">
        <div class="check-icon">&#10003;</div>
        <h2>报名成功!</h2>
        <p id="success-name-display"></p>
      </div>
      <p style="text-align:center;font-size:14px;color:#374151;margin-bottom:8px">请添加客服微信，获取活动最新通知</p>
      <p style="text-align:center;font-size:12px;color:#9CA3AF;margin-bottom:12px">添加微信后报名才算完成哦</p>
      <button class="btn btn-primary" id="show-wechat-btn" style="background:#07C160;font-size:16px">&#128172; 添加微信客服</button>
      <button class="btn btn-outline" id="register-another">返回填写下一位</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="footer">
  <p>&copy; 2026 唯太会 · 活动报名签到系统</p>
</div>

<!-- WeChat QR Code Modal -->
<div class="wechat-modal-overlay" id="wechat-modal-overlay">
  <div class="wechat-modal">
    <div class="modal-icon">&#128172;</div>
    <h3>请添加微信客服</h3>
    <p class="modal-sub">长按识别二维码添加客服微信<br>获取活动入场指引和最新通知</p>
    <div class="wechat-qr-img" id="wechat-qr-img">
      <span class="no-qr" id="wechat-qr-placeholder">客服二维码加载中...</span>
      <img id="wechat-qr-image" src="" alt="微信客服二维码" style="display:none">
    </div>
    <p class="qr-tip"><strong>长按识别二维码</strong>打开微信添加客服</p>
    <button class="btn-close-modal" onclick="closeWechatModal()">我已添加，完成</button>
    <button class="btn-skip" onclick="closeWechatModal()">稍后添加</button>
  </div>
</div>

<script>
(function(){
  // ── Cloud Sync Layer (GitHub API) ──
  var _cloud = {
    token: ['github_pat_','11CK5IX6I0J4TL','gv1DOCAG_HjMnGz','v09yjkX6z8JJqgo','Ju3RQhE5HeNk62','JXzc3IZPTYT3NE','D4RoEDqfm5'].join(''),
    path: 'registrations.json',
    getSha: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ return r.json(); }).then(function(d){ return d.sha; });
    },
    fetch: function(){
      return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+this.path,{
        headers:{'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github.v3+json'}
      }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); })
        .then(function(d){
          var bin = atob(d.content);
          var bytes = new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
          return JSON.parse(new TextDecoder('utf-8').decode(bytes));
        });
    },
    push: function(data){
      var self = this;
      return self.getSha().then(function(sha){
        var body = {
          message: 'Registration: ' + new Date().toISOString(),
          content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
          sha: sha
        };
        return fetch('https://api.github.com/repos/adoman88/meeting-signin/contents/'+self.path,{
          method:'PUT',
          headers:{'Authorization':'Bearer '+self.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
          body:JSON.stringify(body)
        }).then(function(r){ if(!r.ok) throw Error('HTTP '+r.status); return r.json(); });
      });
    }
  };

  document.addEventListener('DOMContentLoaded', function(){
    try{ init(); }catch(e){
      document.getElementById('form-section').style.display = 'block';
    }
  });

  function loadBanner(config){
    var area = document.getElementById('banner-area');
    var img = document.getElementById('banner-img');
    if(config.bannerImage){
      img.src = config.bannerImage;
      area.classList.add('visible');
    } else {
      area.classList.remove('visible');
    }
  }

  function loadEventTheme(config){
    var themeArea = document.getElementById('event-theme-area');
    var nameEl = document.getElementById('event-theme-name');
    var subEl = document.getElementById('event-theme-subtitle');
    var hasTheme = !!(config.eventName);
    var hasSub = !!(config.eventSubtitle);
    if(hasTheme || hasSub){
      nameEl.textContent = config.eventName || '';
      subEl.textContent = config.eventSubtitle || '';
      themeArea.classList.add('visible');
    } else {
      themeArea.classList.remove('visible');
    }
  }

  function loadEventInfo(config){
    var bar = document.getElementById('event-info-bar');
    var parts = [];
    if(config.eventDate){
      var dateStr = config.eventDate;
      if(config.eventTime) dateStr += '（'+config.eventTime+'）';
      parts.push(dateStr);
    }
    if(config.eventLocation) parts.push(config.eventLocation);
    if(parts.length){
      bar.textContent = parts.join('  |  ');
      bar.classList.add('visible');
    } else {
      bar.classList.remove('visible');
    }
  }

  function applyConfig(config){
    loadBanner(config);
    loadEventTheme(config);
    loadEventInfo(config);
  }

  function init(){
    var localConfig = getConfig();
    applyConfig(localConfig);
    bindForm();
    bindActions();
    loadRemoteConfig();
  }

  function loadRemoteConfig(){
    // Try config.json first (fast, same-origin)
    fetch('config.json?_=' + Date.now())
      .then(function(r){ if(!r.ok) throw Error('no'); return r.json(); })
      .then(function(cfg){
        if(cfg && Object.keys(cfg).length){
          localStorage.setItem('meeting_config', JSON.stringify(cfg));
          applyConfig(cfg);
        }
      })
      .catch(function(){
        // Fallback: fetch from GitHub API
        _cloud.fetch().then(function(cloud){
          if(cloud && cloud.config){
            var merged = {};
            try{ var localCfg = JSON.parse(localStorage.getItem('meeting_config')||'{}'); for(var k in localCfg) merged[k] = localCfg[k]; }catch(e){}
            for(var k2 in cloud.config) merged[k2] = cloud.config[k2];
            localStorage.setItem('meeting_config', JSON.stringify(merged));
            applyConfig(merged);
          }
          if(cloud && cloud.registrations && cloud.registrations.length){
            localStorage.setItem('meeting_registrations', JSON.stringify(cloud.registrations));
          }
        }).catch(function(e){ console.log('Remote config skipped:', e.message); });
      });
  }

  function getConfig(){
    try{ return JSON.parse(localStorage.getItem('meeting_config') || '{}'); }catch(e){ return {}; }
  }

  function getRegistrations(){
    try{ return JSON.parse(localStorage.getItem('meeting_registrations') || '[]'); }catch(e){ return []; }
  }

  function saveRegistrations(list){
    localStorage.setItem('meeting_registrations', JSON.stringify(list));
    var config = getConfig();
    _cloud.push({ registrations: list, config: config, updatedAt: new Date().toISOString() })
      .catch(function(e){ console.log('Cloud push skipped:', e.message); });
  }

  function generateId(){
    var now = new Date();
    var date = now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
    var time = pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
    var rnd = Math.random().toString(36).substring(2,6).toUpperCase();
    return 'REG-'+date+'-'+time+rnd;
  }

  function pad(n){ return n<10?'0'+n:''+n; }

  function validPhone(v){ return /^1[3-9]\d{9}$/.test(v); }

  function bindForm(){
    var form = document.getElementById('reg-form');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(!validateForm()) return;
      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '提交中...';

      var data = {
        id: generateId(),
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        company: document.getElementById('company').value.trim(),
        position: document.getElementById('position').value.trim(),
        registerTime: new Date().toISOString(),
        checkinTime: null,
        checkinStatus: 'pending'
      };

      var list = getRegistrations();
      list.push(data);
      saveRegistrations(list);

      setTimeout(function(){
        showSuccess(data);
        btn.disabled = false;
        btn.textContent = '立即报名';
      }, 300);
    });
  }

  function validateForm(){
    var name = document.getElementById('name');
    var phone = document.getElementById('phone');
    var company = document.getElementById('company');
    var referrer = document.getElementById('position');
    var valid = true;

    [name, phone, company, referrer].forEach(function(el){ el.classList.remove('error'); });

    if(!name.value.trim()){ name.classList.add('error'); valid = false; }
    if(!validPhone(phone.value.trim())){ phone.classList.add('error'); valid = false; }
    if(!company.value.trim()){ company.classList.add('error'); valid = false; }
    if(!referrer.value.trim()){ referrer.classList.add('error'); valid = false; }

    return valid;
  }

  function showSuccess(data){
    document.getElementById('success-name-display').textContent = data.name + '，报名已提交';
    document.getElementById('form-section').classList.add('hidden');
    document.getElementById('success-section').classList.add('active');
    showToast('报名成功!','success');

    // Auto-show WeChat QR after a short delay
    setTimeout(function(){
      showWechatModal();
    }, 800);
  }

  function showWechatModal(){
    var config = getConfig();
    var overlay = document.getElementById('wechat-modal-overlay');
    var img = document.getElementById('wechat-qr-image');
    var placeholder = document.getElementById('wechat-qr-placeholder');

    if(config.wechatQRCode){
      img.src = config.wechatQRCode;
      img.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      img.src = '';
      img.style.display = 'none';
      placeholder.style.display = '';
      placeholder.textContent = '客服二维码暂未配置\n请联系现场工作人员';
    }

    overlay.classList.add('show');
  }

  window.closeWechatModal = function(){
    document.getElementById('wechat-modal-overlay').classList.remove('show');
    showToast('报名完成，欢迎参会!','success');
  };

  function bindActions(){
    document.getElementById('show-wechat-btn').addEventListener('click', function(){
      showWechatModal();
    });

    document.getElementById('register-another').addEventListener('click', function(){
      document.getElementById('reg-form').reset();
      document.getElementById('form-section').classList.remove('hidden');
      document.getElementById('success-section').classList.remove('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Close wechat modal on overlay click
    document.getElementById('wechat-modal-overlay').addEventListener('click', function(e){
      if(e.target === this) closeWechatModal();
    });
  }

  function showToast(msg, type){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type||'') + ' show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }
})();
</script>

</body>
</html>
